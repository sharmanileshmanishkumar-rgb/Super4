<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EduMate - Login</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .login-container {
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.1);
            overflow: hidden;
            width: 100%;
            max-width: 1000px;
            min-height: 600px;
            display: grid;
            grid-template-columns: 1fr 1fr;
        }

        .left-panel {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            color: white;
            position: relative;
            overflow: hidden;
        }

        .left-panel::before {
            content: '';
            position: absolute;
            top: -50%;
            right: -50%;
            width: 200%;
            height: 200%;
            background: radial-gradient(circle, rgba(255,255,255,0.1) 0%, transparent 70%);
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(180deg); }
        }

        .logo {
            font-size: 3rem;
            font-weight: bold;
            margin-bottom: 20px;
            z-index: 1;
            position: relative;
        }

        .tagline {
            font-size: 1.2rem;
            opacity: 0.9;
            margin-bottom: 30px;
            z-index: 1;
            position: relative;
        }

        .features {
            list-style: none;
            z-index: 1;
            position: relative;
        }

        .features li {
            padding: 10px 0;
            font-size: 1rem;
            opacity: 0.9;
        }

        .features li i {
            margin-right: 10px;
            color: #ffd700;
        }

        .right-panel {
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        .form-header {
            text-align: center;
            margin-bottom: 40px;
        }

        .form-header h2 {
            color: #2d3748;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .form-header p {
            color: #718096;
            font-size: 1rem;
        }

        .auth-tabs {
            display: flex;
            background: #f7fafc;
            border-radius: 10px;
            padding: 5px;
            margin-bottom: 30px;
        }

        .tab-btn {
            flex: 1;
            padding: 12px 20px;
            border: none;
            background: transparent;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s;
            color: #718096;
        }

        .tab-btn.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        }

        .auth-form {
            display: none;
        }

        .auth-form.active {
            display: block;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            color: #2d3748;
            font-weight: 600;
            font-size: 0.9rem;
        }

        .input-wrapper {
            position: relative;
        }

        .form-input {
            width: 100%;
            padding: 15px 20px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            font-size: 16px;
            transition: all 0.3s;
            background: #f8fafc;
        }

        .form-input:focus {
            outline: none;
            border-color: #667eea;
            background: white;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .input-icon {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            color: #a0aec0;
        }

        .phone-input {
            display: flex;
            gap: 10px;
        }

        .country-code {
            width: 80px;
            padding: 15px 10px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: #f8fafc;
            font-size: 16px;
            text-align: center;
        }

        .phone-number {
            flex: 1;
        }

        .password-toggle {
            position: absolute;
            right: 15px;
            top: 50%;
            transform: translateY(-50%);
            cursor: pointer;
            color: #a0aec0;
            transition: color 0.3s;
        }

        .password-toggle:hover {
            color: #667eea;
        }

        .remember-forgot {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
        }

        .checkbox-wrapper {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .checkbox-wrapper input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #667eea;
        }

        .checkbox-wrapper label {
            color: #4a5568;
            font-size: 0.9rem;
            cursor: pointer;
        }

        .forgot-link {
            color: #667eea;
            text-decoration: none;
            font-size: 0.9rem;
            font-weight: 500;
        }

        .forgot-link:hover {
            text-decoration: underline;
        }

        .submit-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.3s;
            margin-bottom: 20px;
        }

        .submit-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .submit-btn:disabled {
            opacity: 0.6;
            cursor: not-allowed;
            transform: none;
        }

        .divider {
            text-align: center;
            margin: 20px 0;
            position: relative;
            color: #a0aec0;
        }

        .divider::before {
            content: '';
            position: absolute;
            top: 50%;
            left: 0;
            right: 0;
            height: 1px;
            background: #e2e8f0;
        }

        .divider span {
            background: white;
            padding: 0 20px;
            position: relative;
            z-index: 1;
        }

        .social-login {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .social-btn {
            flex: 1;
            padding: 12px;
            border: 2px solid #e2e8f0;
            border-radius: 10px;
            background: white;
            cursor: pointer;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            font-weight: 500;
            color: #4a5568;
        }

        .social-btn:hover {
            border-color: #667eea;
            background: #f7fafc;
        }

        .google-btn {
            color: #db4437;
        }

        .facebook-btn {
            color: #4267b2;
        }

        .signup-link {
            text-align: center;
            color: #718096;
            font-size: 0.9rem;
        }

        .signup-link a {
            color: #667eea;
            text-decoration: none;
            font-weight: 600;
        }

        .signup-link a:hover {
            text-decoration: underline;
        }

        .error-message {
            background: #fed7d7;
            color: #c53030;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .success-message {
            background: #c6f6d5;
            color: #2f855a;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 20px;
            font-size: 0.9rem;
            display: none;
        }

        .loading {
            display: none;
            text-align: center;
            color: #667eea;
        }

        .loading i {
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        /* Mobile Responsive */
        @media (max-width: 768px) {
            .login-container {
                grid-template-columns: 1fr;
                max-width: 400px;
                margin: 20px;
            }

            .left-panel {
                padding: 40px 30px;
                min-height: 300px;
            }

            .right-panel {
                padding: 40px 30px;
            }

            .logo {
                font-size: 2.5rem;
            }

            .tagline {
                font-size: 1rem;
            }

            .features {
                display: none;
            }

            .form-header h2 {
                font-size: 1.5rem;
            }

            .phone-input {
                flex-direction: column;
            }

            .country-code {
                width: 100%;
            }

            .remember-forgot {
                flex-direction: column;
                gap: 15px;
                align-items: flex-start;
            }

            .social-login {
                flex-direction: column;
            }
        }

        @media (max-width: 480px) {
            body {
                padding: 10px;
            }

            .login-container {
                margin: 10px;
                border-radius: 15px;
            }

            .left-panel, .right-panel {
                padding: 30px 20px;
            }

            .logo {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <!-- Left Panel - Branding -->
        <div class="left-panel">
            <div class="logo">
                <i class="fas fa-graduation-cap"></i> EduMate
            </div>
            <div class="tagline">
                Transform Learning with Interactive Animations
            </div>
            <ul class="features">
                <li><i class="fas fa-play-circle"></i> Interactive Animations</li>
                <li><i class="fas fa-brain"></i> Visual Learning</li>
                <li><i class="fas fa-mobile-alt"></i> Mobile Friendly</li>
                <li><i class="fas fa-users"></i> Community Learning</li>
            </ul>
        </div>

        <!-- Right Panel - Authentication -->
        <div class="right-panel">
            <div class="form-header">
                <h2>Welcome Back!</h2>
                <p>Sign in to continue your learning journey</p>
            </div>

            <!-- Error/Success Messages -->
            <div class="error-message" id="errorMessage"></div>
            <div class="success-message" id="successMessage"></div>

            <!-- Auth Tabs -->
            <div class="auth-tabs">
                <button class="tab-btn active" data-tab="signin">Sign In</button>
                <button class="tab-btn" data-tab="signup">Sign Up</button>
            </div>

            <!-- Sign In Form -->
            <form class="auth-form active" id="signinForm">
                <div class="form-group">
                    <label for="signinEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signinEmail" class="form-input" placeholder="Enter your email" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signinPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signinPassword" class="form-input" placeholder="Enter your password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('signinPassword')"></i>
                    </div>
                </div>

                <div class="remember-forgot">
                    <div class="checkbox-wrapper">
                        <input type="checkbox" id="rememberMe">
                        <label for="rememberMe">Remember me</label>
                    </div>
                    <a href="#" class="forgot-link">Forgot Password?</a>
                </div>

                <button type="submit" class="submit-btn" id="signinBtn">
                    <span class="btn-text">Sign In</span>
                    <div class="loading">
                        <i class="fas fa-spinner"></i> Signing in...
                    </div>
                </button>
            </form>

            <!-- Sign Up Form -->
            <form class="auth-form" id="signupForm">
                <div class="form-group">
                    <label for="signupName">Full Name</label>
                    <div class="input-wrapper">
                        <input type="text" id="signupName" class="form-input" placeholder="Enter your full name" required>
                        <i class="fas fa-user input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupEmail">Email Address</label>
                    <div class="input-wrapper">
                        <input type="email" id="signupEmail" class="form-input" placeholder="Enter your email" required>
                        <i class="fas fa-envelope input-icon"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPhone">Phone Number</label>
                    <div class="phone-input">
                        <select class="country-code" id="countryCode">
                            <option value="+1">+1</option>
                            <option value="+91" selected>+91</option>
                            <option value="+44">+44</option>
                            <option value="+86">+86</option>
                            <option value="+81">+81</option>
                        </select>
                        <input type="tel" id="signupPhone" class="form-input phone-number" placeholder="Enter phone number" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="signupPassword">Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="signupPassword" class="form-input" placeholder="Create a password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('signupPassword')"></i>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password</label>
                    <div class="input-wrapper">
                        <input type="password" id="confirmPassword" class="form-input" placeholder="Confirm your password" required>
                        <i class="fas fa-lock input-icon"></i>
                        <i class="fas fa-eye password-toggle" onclick="togglePassword('confirmPassword')"></i>
                    </div>
                </div>

                <div class="checkbox-wrapper" style="margin-bottom: 20px;">
                    <input type="checkbox" id="agreeTerms" required>
                    <label for="agreeTerms">I agree to the <a href="#" style="color: #667eea;">Terms & Conditions</a></label>
                </div>

                <button type="submit" class="submit-btn" id="signupBtn">
                    <span class="btn-text">Create Account</span>
                    <div class="loading">
                        <i class="fas fa-spinner"></i> Creating account...
                    </div>
                </button>
            </form>

            <!-- Divider -->
            <div class="divider">
                <span>or continue with</span>
            </div>

            <!-- Social Login -->
            <div class="social-login">
                <button class="social-btn google-btn" onclick="socialLogin('google')">
                    <i class="fab fa-google"></i>
                    <span>Google</span>
                </button>
                <button class="social-btn facebook-btn" onclick="socialLogin('facebook')">
                    <i class="fab fa-facebook-f"></i>
                    <span>Facebook</span>
                </button>
            </div>

            <!-- Sign Up Link -->
            <div class="signup-link" id="signupLink">
                Don't have an account? <a href="#" onclick="switchTab('signup')">Sign up here</a>
            </div>
        </div>
    </div>

    <script>
        class AuthManager {
            constructor() {
                this.currentTab = 'signin';
                this.initializeEventListeners();
            }

            initializeEventListeners() {
                // Tab switching
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.addEventListener('click', () => {
                        const tab = btn.dataset.tab;
                        this.switchTab(tab);
                    });
                });

                // Form submissions
                document.getElementById('signinForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleSignIn();
                });

                document.getElementById('signupForm').addEventListener('submit', (e) => {
                    e.preventDefault();
                    this.handleSignUp();
                });

                // Real-time validation
                this.setupValidation();
            }

            switchTab(tab) {
                // Update tab buttons
                document.querySelectorAll('.tab-btn').forEach(btn => {
                    btn.classList.remove('active');
                });
                document.querySelector(`[data-tab="${tab}"]`).classList.add('active');

                // Update forms
                document.querySelectorAll('.auth-form').forEach(form => {
                    form.classList.remove('active');
                });
                document.getElementById(`${tab}Form`).classList.add('active');

                // Update header
                const header = document.querySelector('.form-header h2');
                const subheader = document.querySelector('.form-header p');
                const signupLink = document.getElementById('signupLink');

                if (tab === 'signin') {
                    header.textContent = 'Welcome Back!';
                    subheader.textContent = 'Sign in to continue your learning journey';
                    signupLink.innerHTML = 'Don\'t have an account? <a href="#" onclick="switchTab(\'signup\')">Sign up here</a>';
                } else {
                    header.textContent = 'Create Account';
                    subheader.textContent = 'Join EduMate and start learning with animations';
                    signupLink.innerHTML = 'Already have an account? <a href="#" onclick="switchTab(\'signin\')">Sign in here</a>';
                }

                this.currentTab = tab;
                this.hideMessages();
            }

            setupValidation() {
                // Email validation
                document.getElementById('signinEmail').addEventListener('blur', () => {
                    this.validateEmail('signinEmail');
                });

                document.getElementById('signupEmail').addEventListener('blur', () => {
                    this.validateEmail('signupEmail');
                });

                // Password confirmation
                document.getElementById('confirmPassword').addEventListener('blur', () => {
                    this.validatePasswordMatch();
                });

                // Phone validation
                document.getElementById('signupPhone').addEventListener('input', () => {
                    this.formatPhoneNumber();
                });
            }

            validateEmail(fieldId) {
                const email = document.getElementById(fieldId).value;
                const emailRegex = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;
                
                if (email && !emailRegex.test(email)) {
                    this.showError('Please enter a valid email address');
                    return false;
                }
                return true;
            }

            validatePasswordMatch() {
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                
                if (confirmPassword && password !== confirmPassword) {
                    this.showError('Passwords do not match');
                    return false;
                }
                return true;
            }

            formatPhoneNumber() {
                const phoneInput = document.getElementById('signupPhone');
                let value = phoneInput.value.replace(/\D/g, '');
                
                if (value.length > 10) {
                    value = value.substring(0, 10);
                }
                
                phoneInput.value = value;
            }

            async handleSignIn() {
                const email = document.getElementById('signinEmail').value;
                const password = document.getElementById('signinPassword').value;
                const rememberMe = document.getElementById('rememberMe').checked;

                if (!this.validateEmail('signinEmail')) return;

                this.setLoading('signinBtn', true);
                this.hideMessages();

                try {
                    // Simulate API call
                    await this.simulateApiCall();
                    
                    // Store user data
                    const userData = {
                        email: email,
                        name: email.split('@')[0],
                        loginTime: new Date().toISOString(),
                        rememberMe: rememberMe
                    };

                    localStorage.setItem('userData', JSON.stringify(userData));
                    
                    this.showSuccess('Welcome back! Redirecting to EduMate...');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);

                } catch (error) {
                    this.showError('Invalid email or password. Please try again.');
                } finally {
                    this.setLoading('signinBtn', false);
                }
            }

            async handleSignUp() {
                const name = document.getElementById('signupName').value;
                const email = document.getElementById('signupEmail').value;
                const phone = document.getElementById('signupPhone').value;
                const countryCode = document.getElementById('countryCode').value;
                const password = document.getElementById('signupPassword').value;
                const confirmPassword = document.getElementById('confirmPassword').value;
                const agreeTerms = document.getElementById('agreeTerms').checked;

                // Validation
                if (!this.validateEmail('signupEmail')) return;
                if (!this.validatePasswordMatch()) return;
                if (phone.length < 10) {
                    this.showError('Please enter a valid phone number');
                    return;
                }
                if (!agreeTerms) {
                    this.showError('Please agree to the Terms & Conditions');
                    return;
                }

                this.setLoading('signupBtn', true);
                this.hideMessages();

                try {
                    // Simulate API call
                    await this.simulateApiCall();
                    
                    // Store user data
                    const userData = {
                        name: name,
                        email: email,
                        phone: countryCode + phone,
                        signupTime: new Date().toISOString()
                    };

                    localStorage.setItem('userData', JSON.stringify(userData));
                    
                    this.showSuccess('Account created successfully! Welcome to EduMate!');
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 2000);

                } catch (error) {
                    this.showError('Failed to create account. Please try again.');
                } finally {
                    this.setLoading('signupBtn', false);
                }
            }

            async socialLogin(provider) {
                this.hideMessages();
                this.showSuccess(`Redirecting to ${provider}...`);
                
                // Simulate social login
                setTimeout(() => {
                    const userData = {
                        name: `${provider} User`,
                        email: `user@${provider}.com`,
                        provider: provider,
                        loginTime: new Date().toISOString()
                    };

                    localStorage.setItem('userData', JSON.stringify(userData));
                    window.location.href = 'index.html';
                }, 1500);
            }

            setLoading(buttonId, isLoading) {
                const button = document.getElementById(buttonId);
                const btnText = button.querySelector('.btn-text');
                const loading = button.querySelector('.loading');

                if (isLoading) {
                    btnText.style.display = 'none';
                    loading.style.display = 'block';
                    button.disabled = true;
                } else {
                    btnText.style.display = 'block';
                    loading.style.display = 'none';
                    button.disabled = false;
                }
            }

            showError(message) {
                const errorDiv = document.getElementById('errorMessage');
                errorDiv.textContent = message;
                errorDiv.style.display = 'block';
                
                setTimeout(() => {
                    errorDiv.style.display = 'none';
                }, 5000);
            }

            showSuccess(message) {
                const successDiv = document.getElementById('successMessage');
                successDiv.textContent = message;
                successDiv.style.display = 'block';
                
                setTimeout(() => {
                    successDiv.style.display = 'none';
                }, 5000);
            }

            hideMessages() {
                document.getElementById('errorMessage').style.display = 'none';
                document.getElementById('successMessage').style.display = 'none';
            }

            async simulateApiCall() {
                return new Promise((resolve, reject) => {
                    setTimeout(() => {
                        // Simulate 90% success rate
                        if (Math.random() > 0.1) {
                            resolve();
                        } else {
                            reject(new Error('API Error'));
                        }
                    }, 1500);
                });
            }
        }

        // Global functions for onclick handlers
        function switchTab(tab) {
            authManager.switchTab(tab);
        }

        function socialLogin(provider) {
            authManager.socialLogin(provider);
        }

        function togglePassword(fieldId) {
            const field = document.getElementById(fieldId);
            const toggle = field.parentElement.querySelector('.password-toggle');
            
            if (field.type === 'password') {
                field.type = 'text';
                toggle.classList.remove('fa-eye');
                toggle.classList.add('fa-eye-slash');
            } else {
                field.type = 'password';
                toggle.classList.remove('fa-eye-slash');
                toggle.classList.add('fa-eye');
            }
        }

        // Initialize the authentication manager
        let authManager;
        document.addEventListener('DOMContentLoaded', () => {
            authManager = new AuthManager();
            
            // Check if user is already logged in
            const userData = localStorage.getItem('userData');
            if (userData) {
                // User is already logged in, redirect to main app
                window.location.href = 'index.html';
            }
        });
    </script>
</body>
</html>
